<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kontakt - 3D-Druck Service</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://forminit.com/sdk/v1/forminit.js"></script>
</head>

<body>
  <header class="site-header">
    <div class="header-content">
      <span class="header-icon">🖨️</span>
      <h1>3D-Druck Service</h1>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Startseite</a></li>
        <li><a href="service.html">Service</a></li>
        <li><a href="impressum.html">Impressum</a></li>
        <li><a href="contact.html" class="active">Kontakt</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>📩 Kontakt & Anfrage</h2>
    <p>Nutze gerne das Formular, um mir dein Projekt, eine Anfrage oder deine 3D-Datei zu schicken.</p>
      
    <p>Bitte beachte, dass die Felder <strong>E-Mail</strong> und <strong>Dateiupload</strong> Pflichtfelder sind.</p>

    <form id="contact-form" enctype="multipart/form-data">
      <label for="name">Name</label>
      <input type="text" id="name" name="fi-sender-fullName" placeholder="Vor- und Nachname" />

      <label for="email">E-Mail <span style="color:red">*</span></label>
      <input type="email" id="email" name="fi-sender-email" placeholder="deine@email.de" required />

      <label for="file">3D-Datei (STL, 3MF) <span style="color:red">*</span></label>
      <input type="file" id="file" name="fi-file-3dfile" accept=".stl,.3mf" required />

      <label for="filament">Filament</label>
      <select id="filament" name="fi-select-filament">
        <option value="PLA">PLA</option>
        <option value="PETG">PETG</option>
        <option value="TPU">TPU</option>
        <option value="ASA">ASA</option>
        <option value="Nylon">Nylon</option>
        <option value="Carbon">Carbonfaser-Verstärkt</option>
      </select>

      <label for="color">Farbe</label>
      <input type="text" id="color" name="fi-text-color" placeholder="z. B. Schwarz, Weiß, Blau ..." />

      <label for="customer_info">Projektbeschreibung oder zusätzliche Informationen</label>
      <textarea id="customer_info" name="fi-text-customer_info" rows="5" placeholder="Beschreibe dein Projekt, gewünschte Maße oder spezielle Anforderungen..."></textarea>

      <button type="submit">Anfrage absenden</button>
      <p id="form-status" style="margin-top: 12px; font-weight: bold;"></p>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 3DPrintPro</p>
  </footer>

  <script>
    const forminit = new Forminit();
    const FORM_ID = "l7iucgzdnma";

    document.getElementById("contact-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const status = document.getElementById("form-status");
      const submitBtn = e.target.querySelector('button[type="submit"]');

      status.style.color = "inherit";
      status.textContent = "Anfrage und 3D-Datei werden gesendet...";
      submitBtn.disabled = true;

      const formData = new FormData(e.target);
      const { data, error } = await forminit.submit(FORM_ID, formData);

      submitBtn.disabled = false;

      if (error) {
        status.style.color = "red";
        status.textContent = "Fehler beim Senden: " + error.message;
        return;
      }

      status.style.color = "green";
      status.textContent = "Vielen Dank! Deine Anfrage und 3D-Datei wurden erfolgreich gesendet.";
      e.target.reset();
    });
  </script>
</body>
</html>
